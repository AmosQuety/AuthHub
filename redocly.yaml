# AuthHub — Redocly CLI configuration
#
# This config exists solely to drive `redocly lint authhub` in CI
# (.github/workflows/docs.yml), which validates the OpenAPI document served
# live by the backend at /api/v1/docs/openapi.json.
#
# It does NOT build or host the developer portal. The live site
# (https://amosquety.github.io/AuthHub/) is a hand-rolled static SPA —
# see docs/index.html and docs/README.md. The navbar/sidebar/search/versions
# style of config Redocly supports elsewhere is part of the paid Redocly
# Reunite hosted portal product, which this project does not use.

extends:
  - recommended

apis:
  authhub:
    root: https://authhub-npym.onrender.com/api/v1/docs/openapi.json

rules:
  no-unused-components: warn
  operation-operationId-unique: error
  operation-summary: warn
  security-defined: error
